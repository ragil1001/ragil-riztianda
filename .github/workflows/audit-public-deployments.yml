name: Audit public deployment availability

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-public-deployments.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check DNS and HTTP responses
        shell: bash
        run: |
          set +e
          urls=(
            "https://ragil-riztianda.vercel.app/"
            "https://ragil-riztianda.vercel.app/demos/presensi-mobile-v2/"
            "https://pakel-web.vercel.app/"
            "https://qmssystem.app/"
          )

          for url in "${urls[@]}"; do
            echo "============================================================"
            echo "URL=$url"
            host=$(python3 -c 'from urllib.parse import urlparse; import sys; print(urlparse(sys.argv[1]).hostname)' "$url")
            echo "HOST=$host"
            getent ahosts "$host" | head -5 || echo "DNS_RESOLUTION_FAILED"

            rm -f /tmp/headers /tmp/body
            curl -L --connect-timeout 15 --max-time 45 \
              -A "Mozilla/5.0 DeploymentAudit/3.0" \
              -D /tmp/headers -o /tmp/body -sS "$url"
            curl_exit=$?
            echo "CURL_EXIT=$curl_exit"

            if [ -f /tmp/headers ]; then
              grep -E '^(HTTP/|location:|content-type:|server:)' /tmp/headers | tail -20
            fi

            if [ -f /tmp/body ]; then
              echo "BODY_BYTES=$(wc -c < /tmp/body)"
              title=$(grep -ioE '<title[^>]*>[^<]*</title>' /tmp/body | head -1)
              echo "TITLE=${title:-NONE}"
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chromium browser
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Verify the actual rendered user interfaces
        run: |
          cat > render-audit.cjs <<'EOF'
          const { chromium } = require('playwright');

          const checks = [
            {
              name: 'Portfolio',
              url: 'https://ragil-riztianda.vercel.app/',
              requiredText: ['ALL 54 REPOSITORIES', 'PROJECT EVIDENCE'],
            },
            {
              name: 'Pakel',
              url: 'https://pakel-web.vercel.app/',
              requiredText: ['Pakel'],
            },
            {
              name: 'Presensi demo',
              url: 'https://ragil-riztianda.vercel.app/demos/presensi-mobile-v2/',
              requireFlutterView: true,
            },
          ];

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--enable-unsafe-swiftshader'],
            });

            let failed = false;

            for (const check of checks) {
              const context = await browser.newContext({
                viewport: { width: 1440, height: 1000 },
                locale: 'id-ID',
                serviceWorkers: 'block',
              });
              const page = await context.newPage();
              const pageErrors = [];
              const failedResources = [];

              page.on('pageerror', (error) => pageErrors.push(error.message));
              page.on('console', (message) => {
                if (message.type() === 'error') pageErrors.push(message.text());
              });
              page.on('response', (response) => {
                if (response.status() >= 400) {
                  failedResources.push({
                    status: response.status(),
                    url: response.url(),
                  });
                }
              });
              page.on('requestfailed', (request) => {
                failedResources.push({
                  status: 'REQUEST_FAILED',
                  url: request.url(),
                  error: request.failure()?.errorText || 'unknown',
                });
              });

              console.log(`============================================================`);
              console.log(`BROWSER_CHECK=${check.name}`);
              try {
                const response = await page.goto(`${check.url}?audit=${Date.now()}`, {
                  waitUntil: 'domcontentloaded',
                  timeout: 120000,
                });
                await page.waitForTimeout(check.requireFlutterView ? 20000 : 8000);

                const status = response?.status() ?? 0;
                const title = await page.title();
                const bodyText = await page.locator('body').innerText().catch(() => '');
                const flutterViews = await page.locator('flutter-view, flt-glass-pane, canvas').count();

                console.log(`HTTP_STATUS=${status}`);
                console.log(`TITLE=${title}`);
                console.log(`BODY_TEXT_BYTES=${Buffer.byteLength(bodyText)}`);
                console.log(`FLUTTER_RENDER_NODES=${flutterViews}`);
                console.log(`PAGE_ERRORS=${JSON.stringify(pageErrors)}`);
                console.log(`FAILED_RESOURCES=${JSON.stringify(failedResources)}`);

                if (status >= 400) {
                  failed = true;
                  console.log(`RESULT=FAIL_HTTP`);
                } else if (check.requireFlutterView && flutterViews === 0) {
                  failed = true;
                  console.log(`RESULT=FAIL_NOT_RENDERED`);
                } else if (
                  check.requiredText &&
                  !check.requiredText.every((text) => bodyText.includes(text))
                ) {
                  failed = true;
                  console.log(`RESULT=FAIL_REQUIRED_TEXT`);
                } else if (pageErrors.length > 0 || failedResources.length > 0) {
                  failed = true;
                  console.log(`RESULT=FAIL_RUNTIME_ERRORS`);
                } else {
                  console.log(`RESULT=PASS_RENDERED`);
                }
              } catch (error) {
                failed = true;
                console.log(`RESULT=FAIL_EXCEPTION`);
                console.log(error.stack || error.message);
              }

              await context.close();
            }

            await browser.close();
            process.exit(failed ? 1 : 0);
          })();
          EOF
          node render-audit.cjs
