name: Capture real Presensi Mobile demo screenshots

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/capture-presensi-mobile-demo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout portfolio repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Capture cache-isolated Flutter UI after it renders
        run: |
          mkdir -p public/project-screenshots/presensi-mobile
          cat > capture-presensi.cjs <<'EOF'
          const fs = require('fs');
          const { chromium } = require('playwright');

          const target = 'https://ragil-riztianda.vercel.app/demos/presensi-mobile-v2/';

          function attachDiagnostics(page, label) {
            page.on('console', (message) => {
              console.log(`[${label} console:${message.type()}] ${message.text()}`);
            });
            page.on('pageerror', (error) => {
              console.log(`[${label} pageerror] ${error.stack || error.message}`);
            });
            page.on('requestfailed', (request) => {
              console.log(`[${label} requestfailed] ${request.url()} :: ${request.failure()?.errorText}`);
            });
            page.on('response', (response) => {
              if (response.status() >= 400) {
                console.log(`[${label} HTTP ${response.status()}] ${response.url()}`);
              }
            });
          }

          async function loadRendered(page, label) {
            attachDiagnostics(page, label);
            const response = await page.goto(`${target}?capture=${Date.now()}`, {
              waitUntil: 'domcontentloaded',
              timeout: 120000,
            });
            const status = response?.status() ?? 0;
            console.log(`[${label}] document status=${status} title=${await page.title()}`);
            if (!response || status >= 400) {
              throw new Error(`Presensi Mobile demo HTTP status: ${status}`);
            }

            await page.waitForTimeout(20000);

            const state = await page.evaluate(() => ({
              title: document.title,
              bodyText: document.body?.innerText?.slice(0, 500) || '',
              html: document.body?.innerHTML?.slice(0, 1000) || '',
              flutterViews: document.querySelectorAll('flutter-view').length,
              glassPanes: document.querySelectorAll('flt-glass-pane').length,
              canvases: document.querySelectorAll('canvas').length,
            }));
            console.log(`[${label}] render-state=${JSON.stringify(state)}`);

            if (state.flutterViews + state.glassPanes + state.canvases === 0) {
              throw new Error(`Flutter UI did not attach to the DOM for ${label}`);
            }
          }

          async function capture(context, label, path) {
            const page = await context.newPage();
            await loadRendered(page, label);
            await page.screenshot({ path, fullPage: true });
            const bytes = fs.statSync(path).size;
            console.log(`[${label}] screenshot-bytes=${bytes}`);
            if (bytes < 20000) {
              throw new Error(`Screenshot is likely blank for ${label}: ${bytes} bytes`);
            }
            await page.close();
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--enable-unsafe-swiftshader'],
            });

            const desktopContext = await browser.newContext({
              viewport: { width: 1440, height: 1024 },
              deviceScaleFactor: 1,
              locale: 'id-ID',
              serviceWorkers: 'block',
            });
            await capture(
              desktopContext,
              'desktop',
              'public/project-screenshots/presensi-mobile/demo-desktop.png',
            );
            await desktopContext.close();

            const mobileContext = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true,
              locale: 'id-ID',
              serviceWorkers: 'block',
            });
            await capture(
              mobileContext,
              'mobile',
              'public/project-screenshots/presensi-mobile/demo-mobile.png',
            );
            await mobileContext.close();

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF
          node capture-presensi.cjs
          rm capture-presensi.cjs

      - name: Commit verified screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/project-screenshots/presensi-mobile
          git diff --cached --quiet && exit 0
          git commit -m "chore: capture verified Presensi Mobile demo screenshots [skip ci]"
          git push
