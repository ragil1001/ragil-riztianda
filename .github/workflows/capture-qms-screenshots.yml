name: Capture real QMS screenshots

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/capture-qms-screenshots.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout portfolio repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Capture screenshots from the real QMS deployment
        run: |
          mkdir -p public/project-screenshots/qms
          cat > capture-qms.cjs <<'EOF'
          const { chromium } = require('playwright');

          const baseUrl = 'https://qmssystem.app';

          async function capture(page, path, output) {
            await page.goto(`${baseUrl}${path}`, {
              waitUntil: 'domcontentloaded',
              timeout: 120000,
            });
            await page.waitForTimeout(7000);
            await page.screenshot({ path: output, fullPage: true });
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });

            const desktop = await browser.newPage({
              viewport: { width: 1440, height: 1024 },
              deviceScaleFactor: 1,
            });
            await capture(desktop, '/', 'public/project-screenshots/qms/home-desktop.png');
            await capture(desktop, '/layanan', 'public/project-screenshots/qms/services-desktop.png');
            await capture(desktop, '/karir', 'public/project-screenshots/qms/careers-desktop.png');

            const mobile = await browser.newPage({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true,
            });
            await capture(mobile, '/', 'public/project-screenshots/qms/home-mobile.png');

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF
          node capture-qms.cjs
          rm capture-qms.cjs

      - name: Commit captured screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/project-screenshots/qms
          git diff --cached --quiet && exit 0
          git commit -m "chore: capture real QMS deployment screenshots [skip ci]"
          git push
