name: Fix Work lint

on:
  push:
    branches:
      - chatgpt/taste-skill-overhaul
    paths:
      - .github/workflows/fix-work-lint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/taste-skill-overhaul
      - name: Remove unused map index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/Work/Work.jsx')
          source = path.read_text(encoding='utf-8')
          old = 'portfolioProjects.map((project, index) => ('
          new = 'portfolioProjects.map((project) => ('
          if old not in source:
              raise SystemExit('Expected map signature not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "Ragil Riztianda"
          git config user.email "220711672@students.uajy.ac.id"
          git add src/components/Work/Work.jsx
          git commit -m "fix: remove unused project map index"
          git push origin HEAD:chatgpt/taste-skill-overhaul
